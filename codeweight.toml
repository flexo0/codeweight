# This repo's own weights file, not the defaults: those are src/default.toml, which `codeweight init` writes. It holds
# every key of them, at the values the defaults had before their tuning on the example pairs (milestone 16), so this
# repo's commits weigh as before, but a branch and a case 3 and a loop 2. A file of your own is merged over the
# defaults, so it needs only what it changes.
#
# weight(node) = weights[category(node)] * nest(min(depth, max_depth)), nest 1 for a category of [nesting] flat
# depth: the number of nesting constructs around the node (a branch, a loop, a try / catch / finally, a case,
# a lambda, a function or class declared inside a function); a construct's head (condition, loop header, catch
# parameter, case label) stays at its own depth, only its body is deeper.

[nesting]
model = "linear"        # linear: 1 + factor * depth; exponential: factor ^ depth
factor = 1.0
max_depth = 10          # depth is capped here, so one deep method can't explode the total
# weigh the same at any depth: a statement's or a declaration's parts, which it already weighs the depth of
flat = ["call", "macro", "argument", "bool_op", "operator", "access", "parameter"]

[parameters]            # the parameter at place k (from 0) weighs parameter * min(1 + step * k, max)
step = 0.2              # 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, then 1.0 each: a long list weighs more than its count
max = 2.0

[conditions]            # rules that weigh what a node's kind alone doesn't tell, as an existing category; all off
casts = false           # a cast or type assertion (x as T, (T) x, x!, <T>x, x.(T)) is an operator
let_patterns = false    # Rust's `if let` / `while let` pattern is an operator, as a comparison is
magic_numbers = false   # a number literal but 0 and 1 is an access, as the named constant in its place would be
each_unary = false      # each unary operator counts, no run of them: !!x is 2
nullish_operator = false  # ?? and ??= are an operator, not a bool_op: a default value, no branch

[weights]               # the base weight of each category, for every language
statement = 1
call      = 0.5         # a call, `new`: a chain of getters is long, not hard
macro     = 0.5         # a macro (Rust's `println!(...)`): a call's, so this repo's macros weigh as before
argument  = 0           # each argument of a call: none of their own by default, what is in them weighs
branch    = 3           # if, ternary
case      = 3           # each switch / match case, `default` too: a branch's, as here before
loop      = 2
try       = 1           # the body's nesting is its weight; a catch is the other path
catch     = 2
lambda    = 2
function  = 2           # a declaration, as a lambda: a getter is 3, not mostly its signature
class     = 5
bool_op   = 1           # each run of like && / || operators: a && b && c is 1, a && b || c is 2
jump      = 1           # break, continue, an early return, throw
operator  = 0.25        # each run of like operators: a + b - c is 1, (a + b) * c is 2; x += 1, i++, -x, !x
access    = 0.25        # each field access or index: a.b.c is 2, a[i] is 1; not a call's callee, nor this.x
parameter = 0.5         # a function's or lambda's parameter, the first; not self / this / a receiver

# A file of your own may also override [weights] for one language, and map a node kind to a category. The defaults
# hold none of these, so a [weights] key you set reaches every language.
# [languages.java.weights]          # a language's overrides of [weights]
# lambda = 3
# [languages.java.node_kinds]       # a tree-sitter node kind mapped to a category (or to "none")
# synchronized_statement = "try"

[files]
exclude = [
    "**/node_modules/**", "**/build/**", "**/target/**", "**/generated/**", "**/vendor/**", "**/*.d.ts",
    "**/*.min.js", "**/*.pb.go", "**/zz_generated*.go",
]
test_globs = [
    "**/test/**", "**/tests/**", "**/__tests__/**", "**/*Test.java", "**/*Tests.java",
    "**/*.test.ts", "**/*.spec.ts", "**/*.test.tsx", "**/*.spec.tsx", "**/test_*.py", "**/*_test.py",
    "**/*.test.js", "**/*.spec.js", "**/*.test.jsx", "**/*.spec.jsx", "**/*_test.go",
]
