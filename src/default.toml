# codeweight's weights file. A file of your own is merged over these defaults, so it needs only what it changes.
#
# weight(node) = weights[category(node)] * nest(min(depth, max_depth)), nest 1 for a category of [nesting] flat
# depth: the number of nesting constructs around the node (a branch, a loop, a try / catch / finally, a case,
# a lambda, a function or class declared inside a function); a construct's head (condition, loop header, catch
# parameter, case label) stays at its own depth, only its body is deeper.

[nesting]
model = "linear"        # linear: 1 + factor * depth; exponential: factor ^ depth
factor = 1.5            # each level of nesting adds one and a half base weights
max_depth = 10          # depth is capped here, so one deep method can't explode the total
# weigh the same at any depth: a statement's or a declaration's parts, which it already weighs the depth of
flat = ["call", "macro", "constructor", "argument", "bool_op", "operator", "access", "parameter"]

[parameters]            # the parameter at place k (from 0) weighs parameter * min(1 + step * k, max)
step = 0.3              # 1.65, 2.15, 2.64, 3.14, then 3.3 each: a long list weighs more than its count
max = 2.0

[accesses]              # an access at place k (from 0) in a row weighs access * min(1 + step * k, max);
                        # a.b.c.d: .b at 0, .c at 1, .d at 2
step = 1                # 0.5, 1, then 1.5 each: reaching deep through objects weighs more than its count
max = 3.0

[conditions]            # rules that weigh what a node's kind alone doesn't tell, as an existing category
casts = true            # a cast or type assertion (x as T, (T) x, x!, <T>x, x.(T)) is an operator
let_patterns = true     # Rust's `if let` / `while let` pattern is an operator, as a comparison is
magic_numbers = true    # a number literal but 0 and 1 is an access, as the named constant in its place would be
nullish_operator = false  # ?? and ??= are an operator, not a bool_op: a default value, no branch
nested_ternaries = true   # a ternary in a ternary's alternative (a ? x : b ? y : z) nests, no else-if sibling
free_default = true       # a switch's or match's default case (default, a bare _) weighs nothing, as an else
assignments = true        # a plain = is an operator, as += is; a declaration's initializer (int x = 1) isn't

[weights]               # the base weight of each category, for every language; tuned on the example pairs
statement = 1
call      = 0.49        # a call: a chain of getters is long, not hard
macro     = 1.6         # a macro (Rust's `println!(...)`): what is in it is tokens, unparsed
constructor = 0.949     # new Foo(), new int[3], this(...), a struct literal: a new object, above a call
argument  = 0.316       # each argument of a call, besides what is in it: f(a, b) is 1.1
branch    = 3           # if, ternary
case      = 2.4         # each switch / match case, `default` too: below a branch, as a switch has one more
loop      = 3
try       = 0.95        # the body's nesting is its weight; a catch is the other path
catch     = 2
lambda    = 1.65
function  = 1.55        # a declaration, below a lambda: a getter is 2.55, not mostly its signature
class     = 5
bool_op   = 0.544       # each && / || operator: a && b is 1, a && b && c and a && b || c are 2
jump      = 1.35        # break, continue, an early return, throw
operator  = 0.556       # each operator: a + b is 1, a + b - c and (a + b) * c are 2; x += 1, i++, -x, !x; !!x is 2
access    = 0.5         # each field access or index, by its place in a row ([accesses]): a.b.c is 0.5 + 1; not a
                        # call's callee, nor this.x
parameter = 1.65        # a function's or lambda's parameter, the first; not self / this / a receiver

# A file of your own may also override [weights] for one language, and map a node kind to a category. The defaults
# hold none of these, so a [weights] key you set reaches every language.
# [languages.java.weights]          # a language's overrides of [weights]
# lambda = 3
# [languages.java.node_kinds]       # a tree-sitter node kind mapped to a category (or to "none")
# synchronized_statement = "try"

[docs]                  # a Markdown file's docs weight, and a code comment's: words * word + function words *
                        # function_word + punctuation runs * punctuation + symbol runs * symbol, on the code's scale:
                        # a description weighs what the code it describes does
word = 0.64             # a run of letters and digits; a URL is one word
function_word = 0.32    # a word of function_words in prose (not in inline code or a fenced block): glue
punctuation = 0.32      # a run of prose's punctuation, once however long: `,`, `),`, `."`, a backtick, a lone - or _
symbol = 0.62           # a run of anything else that isn't a space, once however long: `->`, `**`, `##`, `](`, `|`
function_words = [      # whatever their case; a list of one's own replaces this one (add another language's to it)
    "a", "an", "the", "of", "to", "in", "on", "at", "by", "for", "with", "from", "into", "as",
    "is", "are", "was", "were", "be", "been", "being", "it", "its", "this", "that", "these", "those",
    "there", "which", "s",
]

[files]
# an exclude ending in / is a folder: build/ at any depth, src/gen/ or /build/ from the root; --exclude adds more
exclude = [
    "**/node_modules/**", "**/build/**", "**/target/**", "**/generated/**", "**/vendor/**", "**/*.d.ts",
    "**/*.min.js", "**/*.pb.go", "**/zz_generated*.go",
]
test_globs = [
    "**/test/**", "**/tests/**", "**/__tests__/**", "**/*Test.java", "**/*Tests.java",
    "**/*.test.ts", "**/*.spec.ts", "**/*.test.tsx", "**/*.spec.tsx", "**/test_*.py", "**/*_test.py",
    "**/*.test.js", "**/*.spec.js", "**/*.test.jsx", "**/*.spec.jsx", "**/*_test.go",
    "**/test_*.c", "**/*_test.c",
]
docs_globs = ["**/*.md", "**/*.markdown"]   # docs alone, weighed by [docs]; one a test glob matches too is none
