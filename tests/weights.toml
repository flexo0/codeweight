# The engine's tests' weights file: round numbers, each category its own, so a hand-worked sum reads back.
# Complete on its own: the tests never load the defaults, so tuning those can't break them.

[nesting]
model = "linear"   # nest(depth) = 1 + depth
factor = 1
max_depth = 3
flat = []          # every category nests, so a hand-worked sum is weight × nest(depth); `flat` has its own tests

[weights]
statement = 1
call      = 2
branch    = 10
loop      = 20
try       = 30
catch     = 40
lambda    = 50
function  = 100
class     = 1000
bool_op   = 5
jump      = 3
operator  = 0      # 0 but in the snippets about them (`lang::testing::weigh_expressions`), so the others leave them out
access    = 0
parameter = 0      # 0 but in the snippets about them (`lang::testing::weigh_parameters`)

[parameters]
step = 0.5         # with parameter 10: 10, 15, 20, then 20 each
max = 2

[files]
exclude = []
test_globs = []
