[package]
name = "codeweight"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
description = "Weighs code: every element by its weight, heavier when nested, for files, folders and a commit's net delta; Java, TypeScript, JavaScript, Python, Rust, Go, C; weights tuned on 1,400+ bad/good code pairs"
license = "MIT"
readme = "README.md"
authors = ["Dmitriy Churilov"]
repository = "https://github.com/flexo0/codeweight"
keywords = ["code-metrics", "complexity", "cognitive-complexity", "static-analysis", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]
# The design docs, the agents' skill, CI, the installers and the agents' notes are for the repo, not the crate; the
# README links to docs/ on GitHub.
exclude = ["/docs/", "/skills/", "/.github/", "/install.sh", "/install.ps1", "/AGENTS.md", "/CLAUDE.md"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
