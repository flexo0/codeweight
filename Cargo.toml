[package]
name = "codeweight"
version = "0.1.0"
edition = "2024"
description = "Weighs code: every element by its weight, heavier when nested, for files, folders and a commit's net delta"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
tree-sitter = "0.27"
tree-sitter-java = "0.23"

[dev-dependencies]
tempfile = "3"
