[package]
name = "codeweight"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Weighs code: every element by its weight, heavier when nested, for files, folders and a commit's net delta"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tree-sitter = "0.27"
tree-sitter-java = "0.23"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
