# On a `vX.Y.Z` tag: the release binaries, each archived with README.md and LICENSE beside its `.sha256`, and the
# installers (install.sh, install.ps1) set to the tag, attached to a GitHub release of that tag, its notes
# CHANGELOG.md's section for the version; then each installer is run from the release. How a release is made:
# docs/releasing.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # musl: a static binary, so it runs on any x86_64 Linux (old glibc, Alpine) the release is downloaded to.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # macos-latest is arm64: the x86_64 binary is cross-built there by Xcode's toolchain.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: The tag is Cargo.toml's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not Cargo.toml's version v$version"
            exit 1
          fi
      # The toolchain rust-toolchain.toml pins, with the target added to it (not to the runner's stable).
      - name: Toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target ${{ matrix.target }}
      - name: musl-gcc, for the grammars' C
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive
        run: |
          name="codeweight-$GITHUB_REF_NAME-${{ matrix.target }}"
          exe=codeweight
          if [[ "${{ matrix.target }}" == *windows* ]]; then exe=codeweight.exe; fi
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$exe" README.md LICENSE "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            archive="$name.zip"
            7z a "$archive" "$name"
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          rm -r "$name"
          # The hash, then the file's name, as sha256sum writes it; macOS has shasum only.
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## / { if (p) exit; if ($2 == v) { p = 1; next } } p' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          # The installers, each set to install this release by default.
          sed 's/^release_tag=""$/release_tag="'"$GITHUB_REF_NAME"'"/' install.sh > dist/install.sh
          sed "s/^    \$releaseTag = ''\$/    \$releaseTag = '$GITHUB_REF_NAME'/" install.ps1 > dist/install.ps1
          grep -q "^release_tag=\"$GITHUB_REF_NAME\"$" dist/install.sh || { echo "::error::install.sh's release_tag not set"; exit 1; }
          grep -q "^    \$releaseTag = '$GITHUB_REF_NAME'$" dist/install.ps1 || { echo "::error::install.ps1's \$releaseTag not set"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  # Each installer run as a user runs it, from the release just made, and the binary it installs run.
  installers:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          curl -LsSf "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/install.sh" | sh
          "$HOME/.local/bin/codeweight" --version | grep -qx "codeweight ${GITHUB_REF_NAME#v}"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/install.ps1" | iex
          $version = & "$env:LOCALAPPDATA\Programs\codeweight\codeweight.exe" --version
          if ($version -ne "codeweight $($env:GITHUB_REF_NAME.Substring(1))") { throw "installed $version" }
